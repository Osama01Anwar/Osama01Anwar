<svg xmlns="http://www.w3.org/2000/svg" width="880" height="206" viewBox="0 0 880 206" role="img" aria-labelledby="t d">
  <title id="t">Engineering workflow pipeline</title>
  <desc id="d">A seven stage pipeline: spec, build, test, measure, debug, verify, ship. A dashed feedback path returns from verify to build when a regression is found.</desc>
